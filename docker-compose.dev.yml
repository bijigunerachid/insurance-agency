# Development database only. Production deployment is defined in Phase 11.
# Never run "docker compose down -v": it deletes the database volume.
name: insurance-agency-dev

services:
  db:
    # postgres:18.6-alpine3.24, pinned by digest
    image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:?set POSTGRES_TEST_DB in .env}
      TZ: UTC
    ports:
      # Loopback only: the database is never reachable from the network.
      - '127.0.0.1:${DB_PORT:-55433}:5432'
    volumes:
      - db-data:/var/lib/postgresql
      - ./deployment/dev/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
    name: insurance-agency-dev-db
