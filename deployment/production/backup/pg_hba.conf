# PostgreSQL access rules on the agency's server (passed with -c hba_file). Inside the container,
# the local socket is trusted as in the official image; over the network, which only the API and
# the backup job can reach (internal Docker network), a password is always required.
# TYPE  DATABASE     USER  ADDRESS  METHOD
local   all          all            trust
local   replication  all            trust
host    all          all   all      scram-sha-256
host    replication  all   all      scram-sha-256
