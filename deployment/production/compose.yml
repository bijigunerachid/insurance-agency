# Production on the agency's server. Images come from the release file (docker load): nothing is
# ever downloaded at startup. Settings: .env (this folder), .env.api and .env.admin (from the
# *.example files; never committed). Never run "docker compose down -v": it deletes the data.
name: insurance-agency

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  db:
    # PostgreSQL 18.6 (pinned digest) with the backup tools: db.Dockerfile.
    image: insurance-agency-db:${APP_VERSION:?set APP_VERSION in .env}
    pull_policy: never
    restart: unless-stopped
    # Every change is copied to the WAL archive within 5 minutes; backup.sh takes it to the
    # backup disk, encrypted (owner, 30/10/2026: at most 15 minutes of work lost).
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
      - -c
      - archive_timeout=300
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql
      - wal-archive:/wal-archive
    networks: [inside]
    security_opt: ['no-new-privileges:true']
    shm_size: 256m
    mem_limit: 2g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    image: insurance-agency-api:${APP_VERSION:?set APP_VERSION in .env}
    pull_policy: never
    restart: unless-stopped
    env_file: [.env.api]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      TRUST_PROXY: '1'
      DOCUMENTS_DIR: /data/documents
      # Written by backup.sh, shown on the « État du système » page.
      BACKUP_STATUS_FILE: /data/status/backup.json
    volumes:
      - documents:/data/documents
      - ./status:/data/status:ro
      # The agency's logo and tab icon (AGENCY_LOGO_FILE=/data/agency/logo.png …), read only.
      - ./agency:/data/agency:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [inside]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # The offline reader of scans needs memory for one page at a time.
    mem_limit: 3g
    pids_limit: 256
    logging: *logging

  proxy:
    image: insurance-agency-proxy:${APP_VERSION:?set APP_VERSION in .env}
    pull_policy: never
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?set APP_HOST in .env}
      PUBLIC_HTTPS_SUFFIX: ${PUBLIC_HTTPS_SUFFIX:-}
    ports:
      # Only on the server's office address, never 0.0.0.0 (see docs/network.md §4).
      - '${LAN_IP:?set LAN_IP in .env}:${HTTPS_PORT:-443}:8443'
      - '${LAN_IP:?set LAN_IP in .env}:${HTTP_PORT:-80}:8080'
    volumes:
      - proxy-data:/data
      - proxy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [inside, outside]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    logging: *logging

  # One-off administration: database roles and migrations, first administrator, catalogue.
  #   docker compose run --rm tools node scripts/db-roles.js   (etc., see docs/deployment.md)
  tools:
    image: insurance-agency-api:${APP_VERSION:?set APP_VERSION in .env}
    pull_policy: never
    profiles: [tools]
    env_file: [.env.api, .env.admin]
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks: [inside]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    entrypoint: []
    command: ['node', '--version']

  # The backups, run by backup.sh (every 5 minutes from a systemd timer) and its restore steps.
  # Root in its container to read and write every volume, with only the file capabilities.
  backup:
    image: insurance-agency-db:${APP_VERSION:?set APP_VERSION in .env}
    pull_policy: never
    profiles: [tools]
    user: '0:0'
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql
      - wal-archive:/wal-archive
      - documents:/documents
      - proxy-data:/proxy-data
      - ./:/settings
      - ${BACKUP_DISK:-/mnt/agency-backup}:/backup
      - ${BACKUP_IDENTITY_DIR:-./status/no-identity}:/identity:ro
    networks: [inside]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER]
    security_opt: ['no-new-privileges:true']
    entrypoint: ['agency-backup']
    command: ['status']

networks:
  # The database and the API never reach outside the server.
  inside:
    internal: true
  outside: {}

volumes:
  db-data:
    name: insurance-agency-db
  documents:
    name: insurance-agency-documents
  wal-archive:
    name: insurance-agency-wal-archive
  proxy-data:
    name: insurance-agency-proxy-data
  proxy-config:
    name: insurance-agency-proxy-config
